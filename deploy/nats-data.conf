# DEV/INTEGRATION-TEST CONFIG — NOT FOR PRODUCTION. No auth/TLS, dev secrets, dev_mode flags. See SECURITY.md for production hardening.
# WARNING: this NATS server has no authentication or TLS — integration-test use only.
# NATS data-plane server config (per-region).
# Region-local JetStream for KV storage. No leaf nodes or federation —
# all cross-region communication uses HTTP.

listen: 0.0.0.0:4222

jetstream {
  store_dir: "/tmp/nats/jetstream"
  max_mem: 1GB
  max_file: 10GB
}
