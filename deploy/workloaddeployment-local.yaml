apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: jetauth
  annotations:
    description: JetAuth authority workload (local dev only, not production)
spec:
  replicas: 1
  deployPolicy: RollingUpdate
  template:
    labels:
      app.kubernetes.io/name: jetauth
      app.kubernetes.io/component: authority
    spec:
      service:
        image: kind-registry:5000/jetcache/storage-service:dev
        maxRestarts: 10
        localResources:
          environment:
            config:
              NATS_DATA_URL: "nats-data:4222"
              JETAUTH_INSTANCE: "lid"
              JETCACHE_INSTANCE: "lid"
              LDB_INSTANCE: "lid"
              JETCACHE_TCP_PORT: "4080"
              LDB_TCP_PORT: "4080"
              LDB_CONSISTENCY_WATCHER_WAIT_STEPS: "2"
              LDB_CONSISTENCY_WATCHER_WAIT_STEP_SECS: "1"
      components:
        - name: oidc-gateway
          image: kind-registry:5000/jetauth/oidc-gateway:dev
          maxInvocations: 100
          localResources:
            environment:
              config:
                issuer_url: http://localhost:8000
        - name: password-hasher
          image: kind-registry:5000/jetauth/password-hasher:dev
          maxInvocations: 8
        - name: email-worker
          image: kind-registry:5000/jetauth/email-worker:dev
          maxInvocations: 10
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: "localhost"
        - namespace: wasi
          package: config
          interfaces:
            - store
          config:
            jetauth_instance: "lid"
            jetcache_instance: "lid"
            ldb_instance: "lid"
            dev_mode: "true"
            require_email_verification: "false"
            allow_registration: "true"
            email_provider: "log"
            bootstrap_hook: |
              set_superadmin(true);
              log("Bootstrap: promoted " + user.email + " to superadmin");
        - namespace: wasi
          package: http
          interfaces:
            - outgoing-handler
