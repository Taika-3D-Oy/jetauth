apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: WorkloadDeployment
metadata:
  name: jetauth
  annotations:
    description: JetAuth authority workload (GHCR images for CI / external use)
    # Images are published by CI on push to master (:latest) and on tags (:v2.x.x).
    # Replace :latest with a pinned tag for reproducible deployments.
    # Substitute __PLACEHOLDERS__ with sed before applying:
    #   sed -e 's|__ISSUER_URL__|http://localhost:8000|' \
    #       -e 's|__HOST__|localhost|' \
    #       -e 's|__NATS_DATA_URL__|nats-data:4222|' \
    #       -e 's|__EMAIL_PROVIDER__|log|' \
    #       deploy/workloaddeployment-ghcr.yaml | kubectl apply -f -
spec:
  replicas: 1
  deployPolicy: RollingUpdate
  template:
    labels:
      app.kubernetes.io/name: jetauth
      app.kubernetes.io/component: authority
    spec:
      service:
        image: ghcr.io/taika-3d-oy/jetcache/storage-service:v2.0.0-rc.1
        imagePullPolicy: Always
        maxRestarts: 10
        localResources:
          environment:
            config:
              NATS_DATA_URL: "__NATS_DATA_URL__"
              JETAUTH_INSTANCE: "lid"
              JETCACHE_INSTANCE: "lid"
              LDB_INSTANCE: "lid"
              JETCACHE_TCP_PORT: "4080"
              LDB_TCP_PORT: "4080"
              LDB_CONSISTENCY_WATCHER_WAIT_STEPS: "2"
              LDB_CONSISTENCY_WATCHER_WAIT_STEP_SECS: "1"
      components:
        - name: oidc-gateway
          image: ghcr.io/taika-3d-oy/jetauth/oidc-gateway:v2.0.0-rc.1
          imagePullPolicy: Always
          maxInvocations: 100
          localResources:
            environment:
              config:
                issuer_url: __ISSUER_URL__
        - name: password-hasher
          image: ghcr.io/taika-3d-oy/jetauth/password-hasher:v2.0.0-rc.1
          imagePullPolicy: Always
          maxInvocations: 8
        - name: email-worker
          image: ghcr.io/taika-3d-oy/jetauth/email-worker:v2.0.0-rc.1
          imagePullPolicy: Always
          maxInvocations: 10
      hostInterfaces:
        - namespace: wasi
          package: http
          interfaces:
            - incoming-handler
          config:
            host: __HOST__
        - namespace: wasi
          package: config
          interfaces:
            - store
          config:
            jetauth_instance: "lid"
            jetcache_instance: "lid"
            ldb_instance: "lid"
            dev_mode: "false"
            require_email_verification: "true"
            allow_registration: "true"
            email_provider: __EMAIL_PROVIDER__
            bootstrap_hook: |
              set_superadmin(true);
              log("Bootstrap: promoted " + user.email + " to superadmin");
        - namespace: wasi
          package: http
          interfaces:
            - outgoing-handler
