name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt

      - name: Install D-Bus development files
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Check code formatting
        run: cargo fmt --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit tests (host target)
        run: cargo test --workspace --target "$(rustc -vV | grep host | awk '{print $2}')"

      - name: Check jetauth-cli crate packaging
        run: cargo publish -p jetauth-cli --dry-run --locked

      - name: Build WebAssembly components (wasip2 release)
        run: cargo build --workspace --exclude jetauth-cli --target wasm32-wasip2 --release
