name: CLI Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  crates:
    name: Publish jetauth-cli to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install D-Bus development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Test jetauth-cli
        run: cargo test -p jetauth-cli --locked

      - name: Publish jetauth-cli
        run: cargo publish -p jetauth-cli --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install D-Bus development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Build jetauth
        run: cargo build -p jetauth-cli --release --locked --target "${{ matrix.target }}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: tar -C "target/${{ matrix.target }}/release" -czf "jetauth-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" jetauth

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/jetauth.exe" -DestinationPath "jetauth-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetauth-${{ matrix.target }}
          path: jetauth-${{ github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jetauth-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "JetAuth ${{ github.ref_name }}" --generate-notes
