name: Publish

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1.0.0 or latest)"
        required: true
        default: "latest"

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run unit tests (host target)
        run: cargo test --workspace --target "$(rustc -vV | grep host | awk '{print $2}')"

      - name: Run cargo audit (dependency vulnerabilities)
        run: cargo audit

      - name: Install ORAS CLI
        uses: oras-project/setup-oras@v1

      - name: Determine image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute image prefix (lowercase)
        id: prefix
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build workspace (wasip2 release)
        run: cargo build --workspace --target wasm32-wasip2 --release

      - name: Push components to GHCR
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: |
          components=(oidc-gateway password-hasher email-worker)
          prefixes=("${IMAGE_PREFIX}" "ghcr.io/taika-3d-oy/lattice-id")
          for prefix in "${prefixes[@]}"; do
            for comp in "${components[@]}"; do
              wasm="${comp//-/_}"
              echo "==> Pushing ${prefix}/${comp}:${TAG}"
              oras push "${prefix}/${comp}:${TAG}" \
                "target/wasm32-wasip2/release/${wasm}.wasm:application/wasm" || true
              if [[ "${TAG}" != "latest" ]]; then
                echo "==> Pushing ${prefix}/${comp}:latest"
                oras push "${prefix}/${comp}:latest" \
                  "target/wasm32-wasip2/release/${wasm}.wasm:application/wasm" || true
              fi
            done
          done

      - name: Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE_PREFIX: ${{ steps.prefix.outputs.prefix }}
        run: |
          echo "## Published images" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for comp in oidc-gateway password-hasher email-worker; do
            echo "- \`${IMAGE_PREFIX}/${comp}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          done
