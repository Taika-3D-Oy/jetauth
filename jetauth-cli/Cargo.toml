[package]
name = "jetauth-cli"
edition.workspace = true
version.workspace = true
authors.workspace = true
description = "Command-line interface for JetAuth"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["jetauth", "oidc", "oauth2", "sso", "cli"]
categories = ["authentication", "command-line-utilities"]
publish = true

[[bin]]
name = "jetauth"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
directories = "6"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"
url = "2"
